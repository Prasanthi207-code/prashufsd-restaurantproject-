<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Pantry Junction</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5gEyvX1yEbtIbQyXfOfrXGFwfi47Qs74ysA&s">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --gold:#d4a574;--gold-lt:#e8c49a;--gold-dk:#b8945f;
      --black:#141414;--dark:#1b1b1b;--card:#1a1a1a;--border:#2a2a2a;
      --text:#ffffff;--muted:#b3b3b3;
      --ff-display:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      --ff-body:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:var(--ff-body)}
    html{scroll-behavior:smooth}
    body{min-height:100vh;background:var(--black);color:var(--text);font-family:var(--ff-body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

    /* ===== AUTH HEADER ===== */
    html {
      font-size: 17px;
    }
    .auth-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: rgba(26,26,26,0.98);
      padding: 16px 24px;
      min-height: 74px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      border-bottom: 1px solid rgba(212,165,116,0.18);
    }
    .back-arrow {
      width: 46px;
      height: 46px;
      border: 1px solid rgba(212,165,116,0.5);
      border-radius: 50%;
      background: rgba(212,165,116,0.12);
      color: #d4a574;
      font-size: 1.3rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
      padding: 0;
    }
    .back-arrow:hover {
      background: rgba(212,165,116,0.18);
      transform: translateX(-2px);
    }

    /* ── AUTH LAYOUT ── */
    .auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px;background:linear-gradient(160deg, #141414 0%, #1e1e1e 45%, #141414 100%);position:relative;overflow:hidden}
    .auth-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 40%,rgba(212,165,116,.14) 0%,transparent 70%);pointer-events:none;opacity:0.85;}
    .auth-page::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 85% 25%,rgba(212,165,116,.08) 0%,transparent 70%);pointer-events:none;opacity:0.9;}

    .auth-card{width:100%;max-width:460px;position:relative;z-index:1;box-shadow:0 18px 40px rgba(0,0,0,0.6);border-radius:18px;overflow:hidden;}

    .auth-brand{text-align:center;margin-bottom:36px}
    .brand-icon{width:70px;height:70px;border-radius:50%;background:rgba(212,165,116,.14);border:1px solid rgba(212,165,116,.35);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;box-shadow:0 6px 18px rgba(0,0,0,0.35)}
    .auth-brand h1{font-family:var(--ff-display);font-size:34px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:1px;}
    .auth-brand p{font-size:14px;color:var(--muted);max-width:360px;margin:0 auto;line-height:1.5}

    .form-box{background:rgba(26,26,26,0.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.06);border-top:3px solid rgba(212,165,116,0.7);border-radius:14px;padding:36px 32px;box-shadow:0 12px 28px rgba(0,0,0,0.45);}
    .form-title{font-family:var(--ff-display);font-size:24px;font-weight:600;color:var(--gold);margin-bottom:26px;text-align:center}

    /* Two-column row for wider form */
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}

    .field{margin-bottom:18px}
    .field label{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
    .field input,.field textarea{width:100%;padding:12px 14px;background:#111;border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--ff-body);font-size:14px;outline:none;transition:border-color .2s,background .2s;resize:vertical}
    .field input::placeholder,.field textarea::placeholder{color:#555}
    .field input:focus,.field textarea:focus{border-color:var(--gold);background:#141414}
    .pw-wrap{position:relative}
    .pw-wrap input{padding-right:48px}
    .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#fff;font-size:18px;transition:color .2s;background:none;border:none;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;width:24px;height:24px}
    .pw-toggle:hover{color:var(--gold);}

    /* Password strength dots */
    .pw-strength{display:flex;gap:5px;margin-top:7px;align-items:center}
    .pw-dot{height:3px;flex:1;border-radius:2px;background:var(--border);transition:background .3s}
    .pw-dot.weak{background:#e74c3c}
    .pw-dot.fair{background:#f39c12}
    .pw-dot.good{background:var(--gold)}
    .pw-dot.strong{background:#2ecc71}
    .pw-label{font-size:11px;color:var(--muted);min-width:40px}

    .btn-submit{width:100%;padding:13px;background:linear-gradient(120deg,rgba(212,165,116,0.95),rgba(212,165,116,0.85));color:var(--dark);border:none;border-radius:10px;font-family:var(--ff-body);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s;margin-top:6px;box-shadow:0 8px 18px rgba(0,0,0,0.3)}
    .btn-submit:hover{background:linear-gradient(120deg,rgba(212,165,116,1),rgba(212,165,116,0.9));transform:translateY(-1px);box-shadow:0 12px 24px rgba(0,0,0,0.35)}

    .switch-link{text-align:center;margin-top:22px;font-size:13px;color:var(--muted)}
    .switch-link a{color:var(--gold);text-decoration:none;font-weight:600;border-bottom:1px solid transparent;transition:border-color .2s}
    .switch-link a:hover{border-bottom-color:var(--gold)}

    @media(max-width:900px){
      header{padding:0 24px}
      #desktopNav{display:none}
      .hamburger{display:flex}
    }
    @media(max-width:560px){
      .field-row{grid-template-columns:1fr}
      .auth-page{padding:32px 16px}
      .form-box{padding:28px 20px}
    }
  </style>
</head>
<body>

<header class="auth-header">
  <button class="back-arrow" type="button" aria-label="Go back" onclick="if (window.history.length > 1) { history.back(); } else { window.location.href = 'index.html'; }">
    ←
  </button>
</header>

<!-- AUTH PAGE -->
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">&#127775;</div>
      <h1>Create Account</h1>
      <p>Join Pantry Junction and enjoy exclusive benefits</p>
    </div>

    <div class="form-box">
      <div class="form-title">Your Details</div>
      <form id="signupForm" novalidate>

        <div class="field-row">
          <div class="field">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Your full name" required>
          </div>
          <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="+91 XXXXXXXXXX" required>
          </div>
          <div class="field">
            <label>Delivery Address</label>
            <input type="text" id="address" placeholder="Enter your full address" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Password</label>
            <div class="pw-wrap">
              <input type="password" id="password" placeholder="Min. 6 characters" required>
              <button type="button" class="pw-toggle" aria-label="Toggle password" title="Show or hide password"><i class="fa-solid fa-eye"></i></button>
            </div>
            <div class="pw-strength">
              <div class="pw-dot" id="dot1"></div>
              <div class="pw-dot" id="dot2"></div>
              <div class="pw-dot" id="dot3"></div>
              <div class="pw-dot" id="dot4"></div>
              <span class="pw-label" id="pwLabel"></span>
            </div>
          </div>
          <div class="field">
            <label>Confirm Password</label>
            <div class="pw-wrap">
              <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
              <button type="button" class="pw-toggle" aria-label="Toggle password" title="Show or hide password"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>
      <p class="switch-link">Already have an account? <a href="login.html" onclick="window.location.href='login.html'; return false;">Login</a></p>
    </div>
  </div>
</main>

<script>
  // Toast notifications
  function showToast(msg, duration=3000) {
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:8px;font-size:13px;z-index:9999;border-left:3px solid #d4a574;opacity:1;transition:opacity 0.3s;';
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
    }, duration);
  }

  // Password strength meter
  const pwInput = document.getElementById('password');
  const dots = [document.getElementById('dot1'),document.getElementById('dot2'),document.getElementById('dot3'),document.getElementById('dot4')];
  const pwLabel = document.getElementById('pwLabel');
  const levels = ['','weak','fair','good','strong'];
  const labels = ['','Weak','Fair','Good','Strong'];

  pwInput.addEventListener('input', function(){
    const v = this.value;
    let score = 0;
    if(v.length >= 6) score++;
    if(v.length >= 10) score++;
    if(/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
    if(/[^A-Za-z0-9]/.test(v)) score++;
    dots.forEach((d,i)=>{
      d.className='pw-dot'+(i<score?' '+levels[score]:'');
    });
    pwLabel.textContent = v.length ? labels[score] : '';
    pwLabel.style.color = score<=1?'#e74c3c':score===2?'#f39c12':score===3?'#d4a574':'#2ecc71';
  });

  // Password toggles
  document.querySelectorAll('.pw-toggle').forEach(function(btn){
    btn.addEventListener('click',function(){
      const input = this.parentElement.querySelector('input');
      if(!input) return;
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      const icon = this.querySelector('i');
      icon.classList.toggle('fa-eye', !show);
      icon.classList.toggle('fa-eye-slash', show);
    });
  });

  // Load auth.js
  const authScript = document.createElement('script');
  authScript.src = 'auth.js';
  authScript.onload = function() {
    if (window.getCurrentUser && window.getCurrentUser()) {
      window.location.href = 'index.html';
      return;
    }
    // Setup signup form after auth.js is loaded
    document.getElementById('signupForm').addEventListener('submit', handleSignupFormSubmit);
  };
  document.head.appendChild(authScript);

  async function handleSignupFormSubmit(e) {
    e.preventDefault();

    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const address = document.getElementById('address').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!name || !email || !phone || !address || !password || !confirmPassword) {
        showToast("⚠️ Please fill in all fields.");
        return;
    }

    if (password.length < 6) {
        showToast("⚠️ Password must be at least 6 characters.");
        return;
    }

    if (password !== confirmPassword) {
        showToast("⚠️ Passwords do not match.");
        return;
    }

    showToast("🔄 Creating account...");
    
    // Use the auth.js handleSignup function
    const result = await window.handleSignup(name, email, phone, address, password);
    
    if (result.success) {
        showToast('✅ Account created! Redirecting…');
        setTimeout(() => { window.location.href = 'index.html'; }, 500);
    } else {
        showToast('❌ ' + result.message);
    }
  }

  const defaultAvatarImage = 'U';

  function getUserInitial(name) {
    const safeName = (name || 'User').trim();
    return safeName ? safeName.charAt(0).toUpperCase() : 'U';
  }

  function setAvatarElement(el, user) {
    if (!el || !user) return;
    const initial = getUserInitial(user['FULL NAME'] || user.name || 'User');
    el.textContent = initial;
    el.style.background = 'linear-gradient(135deg, #d4a574, #b88a54)';
    el.style.color = '#1a1a1a';
  }

  function checkLoginStatus(){
    const user = window.getCurrentUser ? window.getCurrentUser() : null;
    const pp = document.getElementById('profilePic');
    const mp = document.getElementById('mobileProfileSection');
    const loggedOutContent = document.getElementById('loggedOutContent');
    const loggedInContent = document.getElementById('loggedInContent');

    if (user) {
      if (pp) setAvatarElement(pp, user);
      if (loggedOutContent) loggedOutContent.style.display='none';
      if (loggedInContent) loggedInContent.style.display='block';
      const userName = document.getElementById('userName');
      const userEmail = document.getElementById('userEmail');
      const userPhone = document.getElementById('userPhone');
      if (userName) userName.textContent = user['FULL NAME']||'User';
      if (userEmail) userEmail.textContent = user['EMAIL ADDRESS']||'';
      if (userPhone) userPhone.textContent = user['PHONE NUMBER'] ? 'Phone: ' + user['PHONE NUMBER'] : 'Phone: Not provided';
      if (mp) {
        mp.innerHTML='<p class="m-user">Hi, '+(user['FULL NAME']||'User')+'</p><p class="m-phone">' + (user['PHONE NUMBER'] ? 'Phone: ' + user['PHONE NUMBER'] : 'Phone: Not provided') + '</p><button class="m-btn" onclick="window.location.href=\'profile.html\'">View Profile</button><button class="m-btn outline" onclick="logout()">Logout</button>';
      }
    } else {
      if (pp) pp.textContent = '👤';
      if (loggedOutContent) loggedOutContent.style.display='block';
      if (loggedInContent) loggedInContent.style.display='none';
      if (mp) {
        mp.innerHTML='<button class="m-btn" onclick="window.location.href=\'login.html\'">Login</button><button class="m-btn outline" onclick="window.location.href=\'signup.html\'">Sign Up</button>';
      }
    }
  }
  
  function toggleProfileDropdown(){
    const dropdown = document.getElementById('profileDropdown');
    if (dropdown) dropdown.classList.toggle('show');
  }
  
  document.addEventListener('click',function(e){
    const ps = document.querySelector('#desktopNav .profile-section');
    const dd = document.getElementById('profileDropdown');
    if(ps&&!ps.contains(e.target)&&dd) dd.classList.remove('show');
  });
  
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mobileOverlay = document.getElementById('mobileOverlay');
  const closeBtn = document.getElementById('closeBtn');

  if (hamburgerBtn) {
    hamburgerBtn.addEventListener('click',function(){
      if (mobileOverlay) {
        mobileOverlay.classList.add('open');
      }
      document.body.style.overflow='hidden';
    });
  }
  
  if (closeBtn) {
    closeBtn.addEventListener('click',function(){
      if (mobileOverlay) {
        mobileOverlay.classList.remove('open');
      }
      document.body.style.overflow='';
    });
  }
  
  if (mobileOverlay) {
    document.querySelectorAll('#mobileOverlay .mobile-links a').forEach(function(a){
      a.addEventListener('click',function(){
        mobileOverlay.classList.remove('open');
        document.body.style.overflow='';
      });
    });
  }
  
  document.addEventListener('DOMContentLoaded', checkLoginStatus);
</script>
</body>
</html>
