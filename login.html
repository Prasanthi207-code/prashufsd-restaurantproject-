<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Pantry Junction</title>
  <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5gEyvX1yEbtIbQyXfOfrXGFwfi47Qs74ysA&s">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root{
      --gold:#d4a574;--gold-lt:#e8c49a;--gold-dk:#b8945f;
      --black:#141414;--dark:#1b1b1b;--card:#1a1a1a;--border:#2a2a2a;
      --text:#ffffff;--muted:#b3b3b3;
      --ff-display:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
      --ff-body:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;font-family:var(--ff-body)}
    html{scroll-behavior:smooth}
    body{min-height:100vh;background:var(--black);color:var(--text);font-family:var(--ff-body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

    /* ===== AUTH HEADER ===== */
    html {
      font-size: 17px;
    }
    .auth-header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      background: rgba(26,26,26,0.98);
      padding: 16px 24px;
      min-height: 74px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.25);
      border-bottom: 1px solid rgba(212,165,116,0.18);
    }
    .back-arrow {
      width: 46px;
      height: 46px;
      border: 1px solid rgba(212,165,116,0.5);
      border-radius: 50%;
      background: rgba(212,165,116,0.12);
      color: #d4a574;
      font-size: 1.3rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease;
      padding: 0;
    }
    .back-arrow:hover {
      background: rgba(212,165,116,0.18);
      transform: translateX(-2px);
    }

    /* ── AUTH LAYOUT ── */
    .auth-page{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px;background:linear-gradient(160deg, #141414 0%, #1e1e1e 45%, #141414 100%);position:relative;overflow:hidden}
    .auth-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 40%,rgba(212,165,116,.14) 0%,transparent 70%);pointer-events:none;opacity:0.85;}
    .auth-page::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 85% 25%,rgba(212,165,116,.08) 0%,transparent 70%);pointer-events:none;opacity:0.9;}

    .auth-card{width:100%;max-width:440px;position:relative;z-index:1;box-shadow:0 18px 40px rgba(0,0,0,0.6);border-radius:18px;overflow:hidden;}

    /* Card header */
    .auth-brand{text-align:center;margin-bottom:40px}
    .auth-brand .brand-icon{width:70px;height:70px;border-radius:50%;background:rgba(212,165,116,.14);border:1px solid rgba(212,165,116,.35);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 16px;box-shadow:0 6px 18px rgba(0,0,0,0.35)}
    .auth-brand h1{font-family:var(--ff-display);font-size:34px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:1px;}
    .auth-brand p{font-size:14px;color:var(--muted);max-width:360px;margin:0 auto;line-height:1.5}

    /* Form box */
    .form-box{background:rgba(26,26,26,0.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.06);border-top:3px solid rgba(212,165,116,0.7);border-radius:14px;padding:36px 32px;box-shadow:0 12px 28px rgba(0,0,0,0.45);}

    .form-title{font-family:var(--ff-display);font-size:24px;font-weight:600;color:var(--gold);margin-bottom:24px;text-align:center}

    .field{margin-bottom:18px}
    .field label{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
    .field input,.field textarea{width:100%;padding:12px 14px;background:#111;border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:var(--ff-body);font-size:14px;outline:none;transition:border-color .2s,background .2s;resize:vertical}
    .field input::placeholder,.field textarea::placeholder{color:#555}
    .field input:focus,.field textarea:focus{border-color:var(--gold);background:#141414}
    .pw-wrap{position:relative}
    .pw-wrap input{padding-right:48px}
    .pw-toggle{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#fff;font-size:18px;transition:color .2s;background:none;border:none;padding:0;display:flex;align-items:center;justify-content:center;line-height:1;width:24px;height:24px}
    .pw-toggle:hover{color:var(--gold);}

    .btn-submit{width:100%;padding:13px;background:linear-gradient(120deg,rgba(212,165,116,0.95),rgba(212,165,116,0.85));color:var(--dark);border:none;border-radius:10px;font-family:var(--ff-body);font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:background .2s,transform .15s,box-shadow .2s;margin-top:8px;box-shadow:0 8px 18px rgba(0,0,0,0.3)}
    .btn-submit:hover{background:linear-gradient(120deg,rgba(212,165,116,1),rgba(212,165,116,0.9));transform:translateY(-1px);box-shadow:0 12px 24px rgba(0,0,0,0.35)}

    .divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:#444;font-size:12px}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}

    .btn-google{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#3c3c3c;font-family:var(--ff-body);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s,box-shadow .2s,transform .15s}
    .btn-google:hover{background:#f5f5f5;box-shadow:0 2px 12px rgba(0,0,0,.25);transform:translateY(-1px)}
    .btn-google svg{width:18px;height:18px;flex-shrink:0}

    .switch-link{text-align:center;margin-top:22px;font-size:13px;color:var(--muted)}
    .switch-link span{color:var(--gold);cursor:pointer;font-weight:600;transition:color .2s;border-bottom:1px solid transparent;display:inline-block;padding:2px 0}
    .switch-link span:hover{color:var(--gold-lt);border-bottom-color:var(--gold-lt)}

    /* Toast */
    #toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--card);color:var(--text);padding:12px 24px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;z-index:9999;pointer-events:none;border-left:3px solid var(--gold);white-space:nowrap;max-width:90vw}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    @media(max-width:900px){
      header{padding:0 24px}
      #desktopNav{display:none}
      .hamburger{display:flex}
    }
    @media(max-width:480px){
      .auth-page{padding:32px 16px}
      .form-box{padding:28px 20px}
    }
  </style>
</head>
<body>

<header class="auth-header">
  <button class="back-arrow" type="button" aria-label="Go back" onclick="if (window.history.length > 1) { history.back(); } else { window.location.href = 'index.html'; }">
    ←
  </button>
</header>

<!-- AUTH PAGE -->
<main class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">&#127860;</div>
      <h1>Pantry Junction</h1>
      <p>Sign in to your account to continue</p>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-box" id="loginBox">
      <div class="form-title">Welcome Back</div>
      <form id="loginForm" onsubmit="handleLoginForm(event)" novalidate>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="loginPassword" placeholder="Your password" required>
            <button type="button" class="pw-toggle" aria-label="Toggle password" title="Show or hide password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Login</button>
        <div class="divider"><span>OR</span></div>
        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.84l6.1-6.1C34.46 3.09 29.5 1 24 1 14.82 1 7.07 6.48 3.64 14.22l7.1 5.52C12.4 13.67 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.52 24.5c0-1.64-.15-3.22-.42-4.74H24v9h12.7c-.55 2.97-2.2 5.48-4.68 7.17l7.18 5.58C43.46 37.26 46.52 31.36 46.52 24.5z"/>
            <path fill="#FBBC05" d="M10.74 28.26A14.6 14.6 0 0 1 9.5 24c0-1.48.25-2.91.7-4.26l-7.1-5.52A23.93 23.93 0 0 0 0 24c0 3.87.92 7.53 2.56 10.76l8.18-6.5z"/>
            <path fill="#34A853" d="M24 47c5.5 0 10.12-1.82 13.5-4.95l-7.18-5.58C28.55 38.1 26.42 39 24 39c-6.26 0-11.57-4.22-13.48-9.95l-8.07 6.26C6.2 43.09 14.52 47 24 47z"/>
          </svg>
          Continue with Google
        </button>
      </form>
      <p class="switch-link">Don't have an account? <span onclick="showSignup()">Sign Up</span></p>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form-box" id="signupBox" style="display:none;">
      <div class="form-title">Create Account</div>
      <form id="signupForm" onsubmit="handleSignupForm(event)" novalidate>
        <div class="field">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Your full name" required>
        </div>
        <div class="field">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label>Phone Number</label>
          <input type="tel" id="signupPhone" placeholder="+91 XXXXXXXXXX" required>
        </div>
        <div class="field">
          <label>Address</label>
          <textarea id="signupAddress" placeholder="Your delivery address" rows="2" required></textarea>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="password" id="signupPassword" placeholder="Min. 6 characters" required>
            <button type="button" class="pw-toggle" aria-label="Toggle password" title="Show or hide password"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn-submit">Create Account</button>
      </form>
      <p class="switch-link">Already have an account? <span onclick="showLogin()">Login</span></p>
    </div>
  </div>
</main>

<div id="toast"></div>

<script src="auth.js"></script>
<script>
  function showToast(msg,duration=3000){
    const t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),duration);
  }

  function showSignup(){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('signupBox').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
    return false;
  }
  function showLogin(){
    document.getElementById('signupBox').style.display='none';
    document.getElementById('loginBox').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
    return false;
  }

  async function handleLoginForm(event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!email || !password) {
        showToast("⚠️ Please enter email and password.");
        return;
    }

    showToast("🔄 Logging in...");
    
    const result = await window.handleLogin(email, password);
    
    if (result.success) {
        showToast('✅ Login successful! Redirecting…');
        setTimeout(() => { window.location.href = 'index.html'; }, 500);
    } else {
        showToast('❌ ' + result.message);
    }
  }

  async function handleSignupForm(e){
    e.preventDefault();
    const name=document.getElementById('signupName').value.trim();
    const email=document.getElementById('signupEmail').value.trim();
    const phone=document.getElementById('signupPhone').value.trim();
    const address=document.getElementById('signupAddress').value.trim();
    const pw=document.getElementById('signupPassword').value;
    
    if(!name||!email||!phone||!address||!pw){
      showToast('⚠️ Please fill in all fields.');
      return;
    }
    
    if(pw.length<6){
      showToast('⚠️ Password must be at least 6 characters.');
      return;
    }

    showToast("🔄 Creating account...");
    
    const result = await window.handleSignup(name, email, phone, address, pw);
    
    if (result.success) {
        showToast('✅ Account created! Redirecting…');
        setTimeout(()=>window.location.href='index.html', 500);
    } else {
        showToast('❌ ' + result.message);
    }
  }

  const defaultAvatarImage = 'U';

  function getUserInitial(name) {
    const safeName = (name || 'User').trim();
    return safeName ? safeName.charAt(0).toUpperCase() : 'U';
  }

  function setAvatarElement(el, user) {
    if (!el || !user) return;
    const initial = getUserInitial(user['FULL NAME'] || user.name || 'User');
    el.textContent = initial;
    el.style.background = 'linear-gradient(135deg, #d4a574, #b88a54)';
    el.style.color = '#1a1a1a';
  }

  function handleGoogleLogin(){showToast('⚠️ Google login requires backend integration.');}

  // Password toggles
  document.querySelectorAll('.pw-toggle').forEach(function(btn){
    btn.addEventListener('click',function(){
      const input=this.parentElement.querySelector('input');
      if(!input)return;
      const show=input.type==='password';
      input.type=show?'text':'password';
      const icon=this.querySelector('i');
      icon.classList.toggle('fa-eye',!show);
      icon.classList.toggle('fa-eye-slash',show);
    });
  });

  function checkLoginStatus(){
    const user = getCurrentUser();
    const pp=document.getElementById('profilePic');
    const mp=document.getElementById('mobileProfileSection');
    const loggedOutContent = document.getElementById('loggedOutContent');
    const loggedInContent = document.getElementById('loggedInContent');

    if (user) {
      if (pp) setAvatarElement(pp, user);
      if (loggedOutContent) loggedOutContent.style.display = 'none';
      if (loggedInContent) loggedInContent.style.display = 'block';
      const userName = document.getElementById('userName');
      const userEmail = document.getElementById('userEmail');
     if (userName) userName.textContent = user.full_name || 'User';
if (userEmail) userEmail.textContent = user.email || '';
      if (mp) {
        mp.innerHTML = '<p class="m-user">Hi, '+(user.full_name||'User')+'</p><button class="m-btn" onclick="window.location.href=\'profile.html\'">View Profile</button><button class="m-btn outline" onclick="logout()">Logout</button>';
      }
    } else {
      if (pp) pp.textContent = '👤';
      if (loggedOutContent) loggedOutContent.style.display = 'block';
      if (loggedInContent) loggedInContent.style.display = 'none';
      if (mp) {
        mp.innerHTML = '<button class="m-btn" onclick="window.location.href=\'login.html\'">Login</button><button class="m-btn outline" onclick="window.location.href=\'signup.html\'">Sign Up</button>';
      }
    }
  }
  
  function toggleProfileDropdown(){
    const dropdown = document.getElementById('profileDropdown');
    if (dropdown) dropdown.classList.toggle('show');
  }
  
  document.addEventListener('click',function(e){
    const ps=document.querySelector('#desktopNav .profile-section');
    const dd=document.getElementById('profileDropdown');
    if(ps&&!ps.contains(e.target)&&dd)dd.classList.remove('show');
  });
  
  const hamburgerBtn = document.getElementById('hamburgerBtn');
  const mobileOverlay = document.getElementById('mobileOverlay');
  const closeBtn = document.getElementById('closeBtn');

  if (hamburgerBtn) {
    hamburgerBtn.addEventListener('click',function(){
      if (mobileOverlay) {
        mobileOverlay.classList.add('open');
      }
      document.body.style.overflow='hidden';
    });
  }
  
  if (closeBtn) {
    closeBtn.addEventListener('click',function(){
      if (mobileOverlay) {
        mobileOverlay.classList.remove('open');
      }
      document.body.style.overflow='';
    });
  }
  
  if (mobileOverlay) {
    document.querySelectorAll('#mobileOverlay .mobile-links a').forEach(function(a){
      a.addEventListener('click',function(){
        mobileOverlay.classList.remove('open');
        document.body.style.overflow='';
      });
    });
  }
  
  document.addEventListener('DOMContentLoaded',checkLoginStatus);
</script>
</body>
</html>
